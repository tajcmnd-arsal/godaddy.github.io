<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | DomainHub</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-container {
      max-width: 420px;
      margin: 80px auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.1);
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      color: #16a34a;
      border-color: #16a34a;
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
    .auth-form input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 1rem;
    }
    .auth-form button {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }
    .auth-form button:hover {
      background: #15803d;
    }
    .helper {
      text-align: center;
      margin-top: 14px;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">DomainHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="auth-container">
  <div class="tabs">
    <div class="tab active" onclick="showLogin()">Login</div>
    <div class="tab" onclick="showSignup()">Sign Up</div>
  </div>

  <!-- LOGIN -->
  <form class="auth-form active" id="loginForm">
    <input type="email" placeholder="Email address" required />
    <input type="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <div class="helper">Demo only — no real login</div>
  </form>

  <!-- SIGNUP -->
  <form class="auth-form" id="signupForm">
    <input type="text" placeholder="Full name" required />
    <input type="email" placeholder="Email address" required />
    <input type="password" placeholder="Password" required />
    <button type="submit">Create Account</button>
    <div class="helper">Demo only — no data saved</div>
  </form>
</div>

<footer>
  © 2026 DomainHub. Secure login demo.
</footer>

<script>
function showLogin() {
  document.getElementById('loginForm').classList.add('active');
  document.getElementById('signupForm').classList.remove('active');
  document.querySelectorAll('.tab')[0].classList.add('active');
  document.querySelectorAll('.tab')[1].classList.remove('active');
}
